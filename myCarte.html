<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ma Carte</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
  body {
    background: #111827;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .card {
    background: white;
    width: 320px;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .card img {
    width: 100px; height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #7c3aed;
  }
  .card h2 { margin: 15px 0 5px; }
  .card p { color: #6b7280; font-size: 14px; }
  .btn {
    display: block;
    margin-top: 20px;
    background: #7c3aed;
    color: white;
    text-decoration: none;
    padding: 12px;
    border-radius: 12px;
    font-weight: bold;
  }
  .btn:hover { background: #5b21b6; }
</style>
</head>
<body>

  <div class="card">
    <img src="https://i.pravatar.cc/150" alt="Ma photo">
    <h2>Ton Nom Ici</h2>
    <p>Développeur Web | Casablanca</p>
    <a href="#" class="btn">Contacte-moi</a>
  </div>

</body>
</html>
